# Configuration Supabase CLI (développement local) — `supabase start`
project_id = "telima"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "telima"]
extra_search_path = ["public", "extensions", "telima"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
# Le téléphone sert d'identifiant (adresse technique <numéro>@telima.app) : pas de confirmation par e-mail.
enable_confirmations = false
double_confirm_changes = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.admin-create-user]
verify_jwt = true

[functions.reset-password]
verify_jwt = false

[analytics]
enabled = false

[functions.telima-signup]
verify_jwt = false
